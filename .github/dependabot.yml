version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      development-dependencies:
        applies-to: version-updates
        dependency-type: development
        # Major upgrades remain individual pull requests.
        update-types:
          - minor
          - patch
    ignore:
      # Coordinate Harness and AG-UI version upgrades manually. SemVer-only
      # ignores do not suppress vulnerability-driven security updates.
      - dependency-name: "@deepseek-ai/*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: "@ag-ui/*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
