- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  config:
    host: '127.0.0.1'
    port: !!js Number(process.env.PORT)

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: session
  name: '@deepseek-ai/dsh-session'

- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: You are the durable fixture assistant.

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: agent
  name: '@deepseek-ai/dsh-agent'

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []

- id: session-persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_AG_UI_FIXTURE_ROOT
    compression: 'none'

- id: user-questions
  name: '@deepseek-ai/dsh-user-questions'

- id: ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: scripted-model
  name: './scripted-model.mjs'

- id: ag-ui
  name: '../../../lib/index.js'
  config:
    provider: fixture-scripted
    model: fixture-scripted
    sharedSecret: !!js process.env.DSH_AG_UI_FIXTURE_SECRET
    path: /ag-ui
    maxRunEvents: 256
    maxRunEventBytes: 262144
    frontendToolTimeoutMs: 10000
    threadIdleMs: 60000

- id: durable-host
  name: './durable-host.mjs'
