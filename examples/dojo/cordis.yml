- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  config:
    host: !!js process.env.HOST || '127.0.0.1'
    port: !!js Number(process.env.PORT || 8020)

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: session
  name: '@deepseek-ai/dsh-session'

- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: You are the deterministic DSH AG-UI Dojo assistant.

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: agent
  name: '@deepseek-ai/dsh-agent'

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []

- id: scripted-model
  name: './scripted-model.mjs'

- id: ag-ui
  name: '../../lib/index.js'
  config:
    provider: dojo-scripted
    model: dojo-scripted
    sharedSecret: !!js process.env.DSH_AG_UI_SHARED_SECRET
    path: /_internal/ag-ui
    allowNonLoopback: true
    maxRunEvents: 256
    maxRunEventBytes: 262144
    frontendToolTimeoutMs: 10000
    threadIdleMs: 60000

- id: dojo-host
  name: './dojo-host.mjs'
  config:
    debug: !!js process.env.DSH_AG_UI_DOJO_DEBUG === '1'
